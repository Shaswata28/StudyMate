name: Student release builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, platform: windows-x64, archive: zip }
          - { runner: macos-15, platform: macos-arm64, archive: gztar }
          - { runner: macos-15-intel, platform: macos-x64, archive: gztar }
          - { runner: ubuntu-22.04, platform: linux-x64, archive: gztar }
          - { runner: ubuntu-22.04-arm, platform: linux-arm64, archive: gztar }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          STUDYMATE_RELEASE: "1"
          NEXT_TELEMETRY_DISABLED: "1"
      - run: python -m pip install -r backend/requirements.txt pyinstaller
      - run: python backend/test_chat.py
      - run: python backend/test_course_context.py
      - run: python backend/test_diagrams.py
      - run: python backend/test_practice.py
      - run: python -m PyInstaller --onedir --name StudyMate --add-data frontend/out:web backend/student_launcher.py
      - run: python -c "import subprocess, sys; subprocess.run([sys.executable, 'backend/test_chat.py', 'dist/StudyMate/StudyMate' + ('.exe' if sys.platform == 'win32' else '')], check=True)"
      - run: python -c "from shutil import copyfile, copytree, make_archive; copyfile('README.md', 'dist/StudyMate/README.md'); copyfile('LICENSE', 'dist/StudyMate/LICENSE'); copytree('Screenshots', 'dist/StudyMate/Screenshots'); make_archive('StudyMate-${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}-${{ matrix.platform }}', '${{ matrix.archive }}', 'dist', 'StudyMate')"
      - uses: actions/upload-artifact@v4
        with:
          name: StudyMate-${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}-${{ matrix.platform }}
          path: StudyMate-${{ github.ref_type == 'tag' && github.ref_name || 'snapshot' }}-${{ matrix.platform }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" release/StudyMate-* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
